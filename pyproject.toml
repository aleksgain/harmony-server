[project]
name = "harmony-server"
version = "0.1.0"
description = "Self-hosted replacement for Logitech's MyHarmony cloud backend (svcs/setup.myharmony.com) for Harmony Hub provisioning and config sync."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Harmony Revival contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "aiofiles>=24.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "aioharmony>=1.0.11",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-aiofiles"]

[project.scripts]
harmony-server = "harmony_server.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmony_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
