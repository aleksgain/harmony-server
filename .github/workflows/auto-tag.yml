name: Auto Tag

# Runs after CI succeeds on a push to main, derives the next semver tag from
# Conventional Commit messages, pushes it, then runs the Release workflow.
#
# Disabled until the repository variable AUTO_TAG_ENABLED is set to "true"
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Calculate and push version tag
    if: >-
      vars.AUTO_TAG_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Calculate and push tag
        id: version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          release_branches: main
          tag_prefix: v
          # Only feat/fix/perf/BREAKING CHANGE commits release. chore/docs/ci
          # merges do not cut a release (set to "patch" to release every merge).
          default_bump: false

  release:
    name: Release ${{ needs.tag.outputs.new_tag }}
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
